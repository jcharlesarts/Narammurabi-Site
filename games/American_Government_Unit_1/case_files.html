<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Files | Unit 1 Civics</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { --ink:#17222f; --muted:#687583; --panel:#fffdf8; --line:#d9d5cb; --navy:#153a5b; --blue:#dbeaf2; --gold:#e9b44c; --coral:#d9674d; --mint:#cce4d2; --shadow:0 16px 40px rgba(26,37,47,.1); }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 7% 85%,rgba(233,180,76,.23),transparent 30%),linear-gradient(125deg,#eef0ea,#f6f1e7 54%,#dce8eb); font-family:Manrope,sans-serif; } button { font:inherit; cursor:pointer; }
    .app { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:25px 0 40px; } .topbar { display:flex; justify-content:flex-start; gap:15px; align-items:center; padding-bottom:20px; border-bottom:1px solid rgba(21,58,91,.14); } .brand { display:flex; gap:12px; align-items:center; } .seal { width:43px; height:43px; display:grid; place-items:center; border:3px solid var(--gold); border-radius:50%; color:white; background:var(--navy); font:700 18px Fraunces,serif; } .eyebrow,.prompt-tag { color:var(--coral); font:700 10px DM Mono,monospace; letter-spacing:.1em; text-transform:uppercase; } .eyebrow { margin:0 0 3px; } h1,h2,h3,h4,p { margin-top:0; } h1 { margin-bottom:0; font:700 26px/1 Fraunces,serif; letter-spacing:-.04em; } .back { padding:9px 11px; border:1px solid var(--line); border-radius:8px; color:var(--navy); background:var(--panel); font-size:12px; font-weight:800; text-decoration:none; }
    button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid var(--coral); outline-offset:3px; } .activity-nav { display:flex; flex-wrap:wrap; gap:7px; margin-top:18px; }.activity-nav a { display:inline-flex; align-items:center; min-height:36px; padding:8px 11px; border:1px solid var(--line); border-radius:999px; color:var(--navy); background:rgba(255,253,248,.7); font:700 11px DM Mono,monospace; letter-spacing:.04em; text-decoration:none; text-transform:uppercase; }.activity-nav a[aria-current="page"] { color:white; border-color:var(--navy); background:var(--navy); }.intro { display:flex; justify-content:space-between; gap:20px; align-items:center; margin:16px 0 12px; padding:13px 15px; border:1px dashed rgba(21,58,91,.28); border-radius:13px; background:rgba(219,234,242,.48); } .intro h2 { display:inline; margin:0; color:var(--navy); font:700 22px/1.05 Fraunces,serif; letter-spacing:-.04em; } .intro p:not(.eyebrow) { display:inline; max-width:620px; margin:0 0 0 8px; color:var(--muted); font-size:12px; line-height:1.55; } .intro-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .read-case { padding:9px 11px; border:1px solid var(--line); border-radius:8px; color:var(--navy); background:var(--panel); font-size:12px; font-weight:800; cursor:pointer; } .stats { display:flex; gap:8px; } .stat { min-width:76px; padding:9px; border:1px solid var(--line); border-radius:10px; background:rgba(255,253,248,.8); } .stat label { display:block; color:var(--muted); font:500 10px DM Mono,monospace; letter-spacing:.06em; text-transform:uppercase; } .stat strong { display:block; margin-top:5px; color:var(--navy); font:700 21px/1 Fraunces,serif; }
    #activity { display:grid; gap:14px; }.case-board { display:grid; grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr); gap:14px; }.card { position:relative; padding:17px; border:1px solid var(--line); border-radius:15px; background:rgba(255,253,248,.9); box-shadow:var(--shadow); }.case-board .card::before { position:absolute; top:0; right:18px; width:58px; border-top:4px solid var(--gold); content:""; }.case-kicker { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }.chip { padding:5px 8px; border-radius:999px; color:var(--navy); background:var(--blue); font:700 10px DM Mono,monospace; text-transform:uppercase; }.chip.alert { color:#7d3426; background:#f7ddd5; }.case-title { margin:11px 0 0; color:var(--navy); font:700 40px/.95 Fraunces,serif; letter-spacing:-.055em; }.summary { margin:9px 0 0; color:var(--muted); font-size:13px; line-height:1.55; }.case-notes { margin-top:13px; }.case-notes summary { color:var(--navy); font-size:12px; font-weight:800; cursor:pointer; }.case-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:12px; }.fact { padding:10px; border-radius:10px; background:rgba(219,234,242,.45); }.fact label { display:block; margin-bottom:5px; color:var(--muted); font:700 10px DM Mono,monospace; letter-spacing:.06em; text-transform:uppercase; }.fact strong { display:block; font-size:12px; line-height:1.45; }
    .meter { padding:18px; border-radius:15px; color:white; background:linear-gradient(135deg,#16344a,#244f68); box-shadow:var(--shadow); }.meter label { color:#bed3df; font:700 9px DM Mono,monospace; letter-spacing:.08em; text-transform:uppercase; }.meter-value { display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:11px; }.meter-value strong { font:700 42px/1 Fraunces,serif; }.meter-value span { color:#d7e4ea; font-size:11px; text-align:right; }.scale { position:relative; height:18px; margin-top:16px; border-radius:99px; background:linear-gradient(90deg,#d06349,#e9b44c 50%,#6aac7b); }.marker { position:absolute; top:-7px; width:3px; height:32px; border-radius:99px; background:white; box-shadow:0 0 0 3px rgba(255,255,255,.18); transform:translateX(-50%); }.meter-labels { display:flex; justify-content:space-between; gap:7px; margin-top:10px; color:#c7d9e2; font:600 9px DM Mono,monospace; text-transform:uppercase; }.meter-note { margin:12px 0 0; color:#eef6f8; font-size:11px; line-height:1.45; }
    h4 { margin:0; color:var(--navy); font:700 19px/1.1 Fraunces,serif; }.card > p { margin:7px 0 0; color:var(--muted); font-size:12px; line-height:1.45; }.evidence { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }.evidence-button,.choice { width:100%; min-height:62px; padding:12px; text-align:left; border:1px solid #d1cdc3; border-radius:11px; color:var(--ink); background:var(--panel); font-size:12px; font-weight:700; line-height:1.4; transition:transform .16s ease,border-color .16s ease; }.evidence-button:hover:not(:disabled),.choice:hover:not(:disabled) { transform:translateY(-2px); border-color:var(--navy); }.evidence-button span { display:block; margin-top:8px; color:var(--navy); font:700 10px DM Mono,monospace; letter-spacing:.05em; text-transform:uppercase; }.evidence-button small { display:block; margin-top:8px; color:var(--muted); font-size:11px; font-weight:500; line-height:1.45; }.seen-up { border-color:#6dab7d; background:var(--mint); }.seen-down { border-color:#d58b7d; background:#f6dcd5; }.status { margin-top:12px; padding:10px; border-radius:9px; color:var(--navy); background:rgba(219,234,242,.58); font:700 11px/1.45 DM Mono,monospace; }.choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:14px; }.choice:disabled,.evidence-button:disabled { cursor:not-allowed; opacity:.75; }.choice.correct { color:#153f2c; border-color:#6dab7d; background:var(--mint); }.choice.wrong { color:#7d3426; border-color:#d58b7d; background:#f6dcd5; }.choice-key { display:inline-grid; width:21px; height:21px; margin-right:7px; place-items:center; border-radius:50%; color:var(--navy); background:var(--blue); font:500 10px DM Mono,monospace; }.feedback { min-height:20px; margin:12px 0 0; color:var(--navy); font-size:13px; font-weight:700; }.next-row { display:none; gap:9px; align-items:center; margin-top:10px; color:var(--navy); font:700 11px DM Mono,monospace; }.next-row.show { display:flex; }.next { border:0; border-radius:8px; padding:10px 12px; color:white; background:var(--coral); font-size:12px; font-weight:800; }
    @media (max-width:720px) { .app { width:min(100% - 20px,1180px); padding-top:15px; }.back { font-size:10px; }.intro { align-items:flex-start; flex-direction:column; }.intro-actions { width:100%; justify-content:space-between; }.case-board,.evidence,.choices,.case-grid { grid-template-columns:1fr; }.case-title { font-size:35px; }.evidence-card { order:-1; } }
  </style>

</head>
<body>
  <main class="app">
    <header class="study-tools-header"><a href="index.html">← Home</a><span class="eyebrow">American Government / Unit 1</span></header>
    <nav class="study-tools-nav" aria-label="Study tools"><a href="midterm_review.html">Midterm Review</a><a href="curriculum.html">Lesson Guide</a><a href="declaration.html">Declaration Reader</a><a href="vocabulary.html">Vocabulary Vault</a><a href="vocab_race.html">Vocabulary Race</a><a href="who_rules.html">Who Rules?</a><a aria-current="page" href="case_files.html">Case Files</a></nav>
    <section class="intro"><div><p class="eyebrow">Government in action</p><h1 class="page-title">Case Files</h1><h2>Read the case. Find the reality.</h2><p>Open evidence, watch the balance of power shift, then make the final call.</p></div><div class="intro-actions"><label for="caseSelect">Choose a case <select id="caseSelect" style="max-width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></select></label><button class="read-case" id="readCase" type="button">Hear this case</button><div class="stats"><div class="stat"><label>Score</label><strong id="score">000</strong></div><div class="stat"><label>Cases closed</label><strong id="closed">0</strong></div></div></div></section>
    <section id="activity" aria-live="polite"></section>
  </main>
  <script src="study-data.js"></script>
<script>
    const caseFiles = window.STUDY.cases;
    const state = { index:0, meter:50, seen:[], attempts:0, answered:false, score:0, closed:0 };
    const activity = document.getElementById('activity');
    const describeMeter = value => value >= 70 ? 'Citizens have strong leverage over the government.' : value >= 55 ? 'Citizen voice is meaningful, but institutions still matter.' : value >= 40 ? 'The system shows mixed signals. Look for who can actually check leaders.' : 'Power is concentrated above the public, even if democratic language still appears.';
    function initCase() { document.getElementById('caseSelect').value=String(state.index % caseFiles.length); const item = caseFiles[state.index % caseFiles.length]; state.meter = 50; state.seen = Array(item.evidence.length).fill(false); state.attempts = 0; state.answered = false; }
    function updateStats() { document.getElementById('score').textContent = String(state.score).padStart(3,'0'); document.getElementById('closed').textContent = state.closed; }
    function render() {
      const item = caseFiles[state.index % caseFiles.length];
      const ready = state.seen.every(Boolean);
      const meter = Math.max(0,Math.min(100,state.meter));
      const hasEvidence = state.seen.some(Boolean);
      activity.innerHTML = `
        <div class="case-board">
          <section class="card">
            <div class="case-kicker"><span class="prompt-tag">${item.tag}</span><span class="chip">${item.statusLabel}</span><span class="chip alert">${item.claim}</span></div>
            <h3 class="case-title">${item.place}</h3>
            <p class="summary">${item.summary}</p>
            <details class="case-notes"><summary>Open the case notes</summary><div class="case-grid">${item.facts.map(([label,value])=>`<div class="fact"><label>${label}</label><strong>${value}</strong></div>`).join('')}</div></details>
          </section>
          <section class="meter"><label>Evidence guide</label><div class="meter-value"><strong>${hasEvidence ? `${meter} / 100` : '?'}</strong><span>Illustrative scale<br>Citizen voice</span></div><div class="scale" aria-hidden="true"><span class="marker" style="left:${meter}%"></span></div><div class="meter-labels"><span>Ruler control</span><span>Citizen voice</span></div><p class="meter-note">${hasEvidence ? describeMeter(meter) : 'Start with the evidence. The meter summarizes clues; it is not a scientific democracy rating.'}</p></section>
        </div>
        <section class="card evidence-card"><h4>Evidence log: ${item.place}</h4><p>Open every clue. The meter shifts as the evidence shows whether citizens gain real influence or power stays concentrated.</p><div class="evidence">${item.evidence.map((clue,i)=>{ const seen=state.seen[i]; const up=clue.impact >= 0; return `<button class="evidence-button ${seen ? up ? 'seen-up' : 'seen-down' : ''}" data-evidence="${i}" ${seen || state.answered ? 'disabled' : ''}><strong>${clue.label}</strong><span>${seen ? clue.impact === 0 ? 'Context · no shift' : up ? 'Citizen power increased' : 'Citizen power decreased' : 'Open clue'}</span><small>${seen ? clue.note : 'Read the clue, then watch the meter react.'}</small></button>`; }).join('')}</div><div class="status">${ready ? 'All clues opened. Now classify the real system.' : 'Start with one clue. Open every clue before making the final call.'}</div></section>
        <section class="card"><h4>Find the reality</h4><p>${item.question}</p><div class="choices">${item.choices.map((choice,i)=>`<button class="choice" data-choice="${i}" ${ready || state.answered ? '' : 'disabled'}><span class="choice-key">${String.fromCharCode(65+i)}</span>${choice}</button>`).join('')}</div><p class="feedback" id="feedback" aria-live="polite"></p><div class="next-row" id="nextRow"><span>Case closed.</span><button class="next" id="next">Next case</button></div></section>`;
      document.querySelectorAll('[data-evidence]').forEach(button=>button.addEventListener('click',()=>openEvidence(Number(button.dataset.evidence))));
      document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>answer(Number(button.dataset.choice))));
    }
    function openEvidence(index) { const item = caseFiles[state.index % caseFiles.length]; if (state.seen[index] || state.answered) return; state.seen[index] = true; state.meter = Math.max(0,Math.min(100,state.meter + item.evidence[index].impact)); render(); }
    function answer(choice) { const item = caseFiles[state.index % caseFiles.length]; const choices = document.querySelectorAll('[data-choice]'); const feedback = document.getElementById('feedback'); if (state.answered) return; if (choice === item.answer) { choices.forEach((button,index)=>{button.disabled=true;if(index===item.answer)button.classList.add('correct');}); state.answered=true; const earned=state.attempts===0?100:50; state.score += earned; state.closed += 1; feedback.textContent=`${item.clue} +${earned}`; document.getElementById('nextRow').classList.add('show'); document.getElementById('next').addEventListener('click',()=>{state.index += 1;initCase();render();}); } else { state.attempts += 1; choices[choice].disabled=true; choices[choice].classList.add('wrong'); feedback.textContent='Look past the official label. Ask who can compete, criticize, and remove leaders.'; } updateStats(); }
    document.getElementById('readCase').addEventListener('click',()=>{
      if(!('speechSynthesis' in window)) return;
      const item=caseFiles[state.index % caseFiles.length];
      window.speechSynthesis.cancel();
      const utterance=new SpeechSynthesisUtterance(`${item.place}. ${item.summary}`);
      utterance.rate=.92;
      window.speechSynthesis.speak(utterance);
    });
    document.getElementById('caseSelect').innerHTML=caseFiles.map((c,i)=>`<option value="${i}">${c.place}</option>`).join('');
    document.getElementById('caseSelect').onchange=event=>{state.index=Number(event.target.value);initCase();render();};
    initCase(); render(); updateStats();
  </script>
</body>
</html>
